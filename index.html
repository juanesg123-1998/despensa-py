<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Despensa Py</title>
<meta name="description" content="Recetas de 7 países con diario de calorías y macros.">
<meta name="theme-color" content="#F4F6F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despensa">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap">
<style>
/* Layout: app de una columna (máx. 560px) con títulos grandes, listas agrupadas tipo iOS, barra de pestañas translúcida, ficha que entra desde la derecha y hojas que suben desde abajo. Tema claro único, a pedido del usuario. */
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --ink:#17201A; --muted:#5E6A62; --line:#E2E7E0; --fill:#EEF1EC;
  --accent:#2A6B3C; --accent-2:#1F4D33; --accent-soft:#DDEDE2; --on-accent:#FFFFFF;
  --kcal:#E9B23A; --kcal-ink:#8A5F06; --kcal-soft:#FDF3D9;
  --prot:#3E9A63; --prot-ink:#2A6B3C; --carb:#E9B23A; --carb-ink:#8A5F06; --fat:#E8826E; --fat-ink:#B5321F;
  --red:#D8402F; --red-soft:#FBE4E0; --scrim:rgba(23,32,26,.34);
  --shadow:0 1px 2px rgba(23,32,26,.04),0 6px 18px rgba(23,32,26,.06);
  --brand:'Young Serif', Georgia, serif;
  --ui:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:active,.press:active{transform:scale(.97);transition:transform 90ms ease-out}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:flex;flex-direction:column;gap:22px}
.hide{display:none!important}

/* tipografía */
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
h1.big{margin:0;font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.022em}
h2.sec{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.cap{margin:0 4px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.note{margin:0 4px;font-size:13px;color:var(--muted)}
.lt{display:flex;flex-direction:column;gap:4px}
.lt-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brandrow{display:flex;align-items:center;gap:8px}
.brandrow .wm{font-family:var(--brand);font-size:18px;color:var(--accent)}
.py{font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 6px;border-radius:6px;background:var(--red);color:#fff}

/* superficies */
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.group{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:52px;text-align:left;width:100%;color:inherit;text-decoration:none}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-size:16px;font-weight:600}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chev{width:16px;height:16px;flex:none;color:#A7B1A9}
.thumb{flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb svg{width:78%;height:78%}

/* botones */
.btn{height:50px;border-radius:15px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--fill);color:var(--ink)}
.btn.sm{height:40px;font-size:15px;border-radius:12px;width:auto}
.btn[disabled]{opacity:.45}
.icon-btn{width:40px;height:40px;border-radius:20px;background:var(--fill);display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.link{color:var(--accent);font-weight:600}

/* segmentado iOS */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:2px;border-radius:10px;background:var(--fill)}
.seg button{height:34px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(23,32,26,.14)}
.seg.green button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none;font-weight:700}
.chip.x[aria-pressed="true"]{background:var(--red);color:#fff}
.chip.dashed{background:transparent;box-shadow:inset 0 0 0 1.5px #A7B1A9;color:var(--muted)}

/* buscador */
.search{display:flex;gap:10px}
.search label{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px}
.search svg{width:18px;height:18px;flex:none;color:var(--muted)}
.filterbtn{position:relative;width:44px;height:44px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--bg)}

/* Hoy */
.ringcard{padding:20px;display:flex;flex-direction:column;gap:20px}
.ringrow{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr b{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ring .ctr span{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.ring circle{transition:stroke-dasharray .6s var(--spring)}
.kv{display:flex;flex-direction:column;gap:1px}
.kv span{font-size:12px;font-weight:600;color:var(--muted)}
.kv b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.kv b small{font-size:13px;font-weight:600;color:var(--muted)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.macro{display:flex;flex-direction:column;gap:6px;min-width:0}
.macro span{font-size:12px;font-weight:700;color:var(--muted)}
.macro b{font-size:15px;font-weight:800}
.macro b small{font-weight:600;color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .6s var(--spring)}
.week{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr)) 28px;gap:2px;align-items:center}
.week .day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:16px;font-size:12px;font-weight:700;color:var(--muted)}
.week .day svg{width:28px;height:28px;transform:rotate(-90deg)}
.week .day[aria-current="date"]{background:var(--accent);color:#fff}
.week .day.today:not([aria-current="date"]) b{color:var(--accent)}
.week .nav{height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.meal{display:flex;flex-direction:column;gap:8px}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.meal-h span{font-size:14px;font-weight:700;color:var(--muted)}
.entry-k{font-size:15px;font-weight:700;flex:none}
.del{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#A7B1A9;flex:none}
.del.armed{background:var(--red);color:#fff;width:auto;padding:0 10px;font-size:13px;font-weight:700}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px}
.addrow button{height:40px;border-radius:12px;background:var(--fill);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.addrow button svg{width:16px;height:16px}
.setup{padding:16px;display:flex;gap:14px;align-items:center;background:var(--kcal-soft);border-radius:18px;color:#5C4107}
.setup b{display:block;font-size:16px}
.setup span{font-size:13px}

/* Recetas */
.pill-kcal{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:700}
.pill-kcal svg{width:20px;height:20px;transform:rotate(-90deg)}
.pending{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--accent);color:#fff;font-size:15px}
.pending b{flex:1}
.pending button{color:#fff;font-weight:700;text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tile .ic{width:70px;max-width:100%;aspect-ratio:1;border-radius:22px;display:flex;align-items:center;justify-content:center;transition:box-shadow .2s,transform .2s}
.tile .ic svg{width:70%;height:70%}
.tile .lb{font-size:13px;font-weight:700;text-align:center;line-height:1.15}
.tile .ct{font-size:11px;color:var(--muted);margin-top:-4px}
.tile[aria-pressed="true"] .ic{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--accent)}
.tile[aria-pressed="true"] .lb{color:var(--accent)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rcard{flex:0 0 232px;scroll-snap-align:start;border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;text-align:left}
.rcard .art{height:132px;display:flex;align-items:center;justify-content:center;position:relative}
.rcard .art svg{width:116px;height:116px}
.rcard .art .py{position:absolute;top:10px;left:10px}
.rcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.rcard .nm{font-size:17px;font-weight:700;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted)}
.meta .pr{color:var(--prot-ink);font-weight:700}
.listhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
.listhead h2 small{font-weight:600;color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:72px;height:72px}

/* Ficha (página) */
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);transition:transform .42s var(--spring);visibility:hidden}
.page.open{transform:none;visibility:visible}
.hero{position:relative;height:calc(300px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center}
.hero svg.big{width:230px;height:200px}
.glass{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(23,32,26,.12)}
.glass svg{width:21px;height:21px}
.glass.l{left:max(16px,env(safe-area-inset-left,0px))}
.glass.r{right:max(16px,env(safe-area-inset-right,0px))}
.sheetbody{margin-top:-28px;position:relative;background:var(--bg);border-radius:28px 28px 0 0}
.sheetbody .wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));gap:20px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:14px 0}
.stats>span{display:flex;flex-direction:column;align-items:center;gap:2px;border-right:1px solid var(--line)}
.stats>span:last-child{border-right:0}
.stats b{font-size:18px;font-weight:800}
.stats small{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;border-radius:10px;background:var(--fill);overflow:hidden;flex:none}
.stepper button{width:44px;height:36px;font-size:20px;display:flex;align-items:center;justify-content:center}
.stepper .v{min-width:44px;text-align:center;font-weight:800;font-size:16px}
.stepper i{width:1px;height:18px;background:var(--line)}
.scaleq{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--kcal-soft);color:#5C4107}
.scaleq label{flex:1;font-size:15px;font-weight:700}
.scaleq label small{display:block;font-size:13px;font-weight:500}
.scaleq input{width:84px;height:40px;border-radius:10px;border:1.5px solid var(--kcal);background:#fff;text-align:right;padding:0 10px;font-size:17px;font-weight:700}
.scaleq .u{font-weight:700}
.ing{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.ing .n{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.ing .n small{display:block;font-size:12px;color:var(--kcal-ink);font-weight:600}
.ing .q{font-weight:700;white-space:nowrap}
.ing.done .n,.ing.done .q{color:var(--muted);text-decoration:line-through}
.ing .gusto{color:var(--muted);font-size:14px}
.tips{padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;font-size:16px;line-height:1.45}
.steps li b{width:28px;height:28px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px}
.nutri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.nutri div{padding:10px 6px;border-radius:14px;background:var(--fill);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.nutri b{font-size:17px;font-weight:800;white-space:nowrap}
.nutri small{font-size:11px;color:var(--muted)}
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.86);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid rgba(23,32,26,.06)}
.foot>div{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

/* Hoja (sheet) */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheetwrap{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.sheet{pointer-events:auto;width:min(100%,600px);height:calc(100dvh - env(safe-area-inset-top,0px) - 18px);background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .45s var(--spring);box-shadow:0 -8px 30px rgba(23,32,26,.12);visibility:hidden}
.sheet.open{transform:translateY(0);visibility:visible}
.sheet.drag{transition:none}
.sh-head{flex:none;padding:7px 16px 6px;touch-action:none}
.grab{display:block;margin:0 auto 8px;width:36px;height:5px;border-radius:3px;background:#C9D0C7}
.sh-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:36px}
.sh-nav h2{margin:0;font-size:17px;font-weight:700;text-align:center}
.sh-nav .l{justify-self:start;color:var(--accent);font-size:17px}
.sh-nav .r{justify-self:end;color:var(--accent);font-size:17px;font-weight:700}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.sh-foot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.86);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid rgba(23,32,26,.06);display:flex;flex-direction:column;gap:8px}
.sh-foot .sum{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px}
.sh-foot .sum b{color:var(--ink)}

/* Agregar receta */
.ri{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line)}
.ri:last-child{border-bottom:0}
.ri .n{flex:1;min-width:0;display:flex;flex-direction:column}
.ri .n span{font-size:16px;overflow-wrap:anywhere}
.ri .n small{font-size:12px;color:var(--muted)}
.ri.changed .n small{color:var(--kcal-ink);font-weight:700}
.ri.changed .stepper{box-shadow:inset 0 0 0 1.5px var(--kcal)}
.ri.removed .n span{text-decoration:line-through;color:var(--muted)}
.ri .stepper button{width:38px;height:36px}
.ri .stepper input{width:66px;height:36px;border:0;background:transparent;text-align:center;font-weight:700;font-size:15px;outline:none}
.addline{display:grid;grid-template-columns:minmax(0,1fr) 76px auto;gap:8px;padding:10px 12px}
.addline input,.fieldin{height:40px;border-radius:10px;border:0;background:var(--fill);padding:0 10px;font-size:16px;min-width:0;width:100%}
.plate{padding:16px;display:flex;flex-direction:column;gap:12px}
.plate .top{display:flex;align-items:baseline;justify-content:space-between}
.plate .top b{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--kcal-ink)}
.plate .top b small{font-size:15px;color:var(--muted);font-weight:600}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:13px}
.three span{display:flex;flex-direction:column;gap:2px}
.three b{font-size:17px;font-weight:800}
.switchrow{display:flex;align-items:center;gap:12px;padding:14px}
.switchrow .grow{flex:1}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:#D5DBD3;position:relative;flex:none;transition:background .25s;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform .3s var(--spring)}
.sw:checked{background:#34C759}
.sw:checked::after{transform:translateX(20px)}

/* Alimento */
.fi{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.fi:last-child{border-bottom:0}
.fi .top{display:flex;align-items:center;gap:12px}
.fi .units{display:flex;flex-wrap:wrap;gap:6px;padding-left:52px}
.fi .units button{height:32px;padding:0 12px;border-radius:16px;background:var(--fill);font-size:13px;font-weight:600}
.fi .units button[aria-pressed="true"]{background:var(--accent);color:#fff}
.fi .units input{width:84px;height:32px;border-radius:16px;border:1.5px solid var(--accent);padding:0 10px;font-size:14px;text-align:center}
.plus{width:32px;height:32px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.plus svg{width:16px;height:16px}

/* Editor */
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{font-size:16px;font-weight:400;color:var(--ink);padding:11px 12px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);width:100%;min-width:0}
.fld textarea{resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.edrow:last-child{border-bottom:0}
.edrow .n{min-width:0;overflow-wrap:anywhere;font-size:15px;font-weight:600}
.edrow .n small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.edrow .n small.ok{color:var(--prot-ink)}
.edrow .q{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,7rem) minmax(0,9rem);gap:8px}
.edrow .q input,.edrow .q select{height:38px;border-radius:10px;border:0;background:var(--fill);padding:0 10px;font-size:15px;min-width:0}
.edrow .mb{width:36px;height:36px;border-radius:10px;background:var(--fill);color:var(--muted);display:flex;align-items:center;justify-content:center}
.edrow.main{background:linear-gradient(90deg,var(--kcal-soft),transparent 80%)}
.edrow.main .mb.star{background:var(--kcal);color:#fff}
.banner{padding:12px 14px;border-radius:14px;background:var(--kcal-soft);color:#5C4107;font-size:14px}
.err{color:var(--red);font-weight:600;font-size:14px;margin:0 4px}

/* Modo cocina */
.cook{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));gap:22px;transform:translateY(100%);transition:transform .45s var(--spring);visibility:hidden}
.cook.open{transform:none;visibility:visible}
.cook>*{width:100%;max-width:560px;margin-inline:auto}
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.prog i{height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--accent)}
.cook .stepn{font-size:15px;font-weight:800;color:var(--kcal-ink);letter-spacing:.03em}
.cook .stept{margin:8px 0 0;font-size:30px;font-weight:700;line-height:1.18;letter-spacing:-.02em}
.timer{display:flex;align-items:center;gap:16px;padding:18px 20px}
.timer .grow{flex:1;display:flex;flex-direction:column;gap:4px}
.timer .clock{font-size:48px;font-weight:300;line-height:1;letter-spacing:-.02em}
.timer .go{width:64px;height:64px;border-radius:32px;background:var(--kcal);display:flex;align-items:center;justify-content:center}
.timer .go svg{width:26px;height:26px}
.cook .navbtns{margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px}

/* Perfil */
.goal{padding:18px;display:flex;flex-direction:column;gap:14px}
.goal .big{font-size:40px;font-weight:800;letter-spacing:-.025em;color:var(--kcal-ink);line-height:1}
.goal .big small{font-size:16px;color:var(--muted);font-weight:600}
.why{font-size:13px;color:var(--muted);line-height:1.5}

/* barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid rgba(23,32,26,.07);padding:7px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:2px 0 6px;position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab .badge{top:-2px;right:calc(50% - 22px)}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:70;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;font-weight:600;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--spring)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  .page,.sheet,.cook{transition:opacity .2s ease,visibility .2s;transform:none!important;opacity:0}
  .page.open,.sheet.open,.cook.open{opacity:1}
  button:active{transform:none}
}
@media (prefers-reduced-transparency: reduce){
  .tabbar,.foot,.sh-foot,.glass{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}
}

body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}

p:['Herví el maíz y los porotos en abundante agua, a fuego bajo, durante 1 hora.','Sumá las carnes en trozos y el zapallo en cubos. Seguí 2 horas más, revolviendo seguido para que no se pegue.','Aparte, rehogá la cebolla con pimentón y comino y agregala a la olla. El zapallo se deshace y espesa.','Para la salsita, calentá el aceite con verdeo, pimentón y ají, y servila por encima.']},
{id:'noquis',n:'Ñoquis de papa',c:'AR',s:4,t:60,d:'Para el 29 o cualquier domingo.',i:[
[1000,'g','papas','papa'],[300,'g','harina','harina de trigo'],[1,'u','huevo','huevo'],[1,'cdita','sal','sal'],[null,'','nuez moscada','nuez moscada']],
p:['Herví las papas con cáscara, pelalas y hacé puré en caliente.','Sumá huevo, sal, nuez moscada y la harina de a poco, sin amasar de más: la masa tiene que quedar blanda.','Formá cilindros, cortá trocitos y pasalos por un tenedor.','Cociná en agua hirviendo con sal; están listos cuando flotan. Servilos con la salsa que quieras.']},
{id:'pastafrola',n:'Pastafrola',c:'AR',s:8,sw:1,t:60,d:'Masa quebrada, membrillo y enrejado.',i:[
[300,'g','harina','harina de trigo'],[150,'g','manteca fría','manteca'],[100,'g','azúcar','azúcar'],[2,'u','huevos','huevo'],[1,'cdita','polvo de hornear','polvo de hornear'],[500,'g','dulce de membrillo','dulce de membrillo'],[50,'ml','agua caliente','agua'],[null,'','ralladura de limón','limón']],
p:['Batí manteca y azúcar, sumá los huevos y la ralladura.','Incorporá harina y polvo de hornear sin amasar mucho. Reservá un tercio para las tiras.','Forrá un molde de 24 cm. Pisá el membrillo con el agua caliente hasta que quede untable y cubrí la masa.','Armá el enrejado con tiras y horneá a 180 °C unos 35 minutos.']},
{id:'provoleta',n:'Provoleta',c:'AR',s:2,t:15,d:'La entrada del asado.',i:[
[300,'g','provolone en rodaja gruesa','provolone'],[1,'cdita','orégano','orégano'],[1,'cdita','ají molido','ají molido'],[1,'cda','aceite de oliva','aceite']],
p:['Frotá el queso con el orégano y el ají.','En parrilla o plancha bien caliente, cociná 3 minutos hasta que forme costra.','Dalo vuelta con espátula y cociná 2 minutos más.','Terminá con un hilo de aceite y comé enseguida.']},

{id:'chivito',n:'Chivito canadiense',c:'UY',s:4,t:30,d:'El sándwich nacional uruguayo, completo.',i:[
[600,'g','lomo en bifes finos','carne vacuna'],[150,'g','jamón cocido','jamón'],[150,'g','muzzarella','mozzarella'],[100,'g','panceta en fetas','panceta'],[4,'u','huevos','huevo'],[4,'u','panes de chivito','pan'],[2,'u','tomates','tomate'],[80,'g','lechuga','lechuga'],[3,'cda','mayonesa','mayonesa'],[null,'','sal','sal']],
p:['Dorá la panceta y freí los huevos.','Cociná los bifes en plancha muy caliente, 1 minuto por lado. Poné encima jamón y muzzarella hasta que se derrita.','Untá el pan con mayonesa y armá: lechuga, tomate, bife con jamón y queso, panceta y huevo.','Acompañá con papas fritas, como manda la costumbre.']},
{id:'torta-frita',n:'Torta frita',c:'UY',s:6,t:40,d:'Unas 15 unidades. Clásico de día de lluvia.',i:[
[500,'g','harina','harina de trigo'],[75,'g','grasa derretida','grasa'],[250,'ml','agua tibia','agua'],[1,'cdita','sal','sal'],[1,'cdita','polvo de hornear','polvo de hornear'],[null,'','grasa o aceite para freír','aceite para freír']],
p:['Mezclá harina, sal y polvo de hornear; sumá la grasa derretida y el agua tibia.','Amasá apenas hasta que esté lisa y dejá descansar 15 minutos tapada.','Formá bollitos, estiralos finos y hacé un agujero en el centro.','Freí en grasa caliente hasta dorar de ambos lados. Con azúcar o solas.']},
{id:'pascualina',n:'Pascualina',c:'UY',s:6,t:70,d:'Tarta de acelga con huevos enteros adentro.',i:[
[1000,'g','acelga','acelga'],[1,'u','cebolla','cebolla'],[2,'cda','aceite','aceite'],[250,'g','ricota','ricota'],[80,'g','queso rallado','parmesano'],[6,'u','huevos (2 al relleno, 4 enteros)','huevo'],[2,'u','tapas de pascualina','masa de tarta'],[null,'','nuez moscada','nuez moscada'],[null,'','sal y pimienta','sal']],
p:['Blanqueá la acelga, escurrila muy bien y picala.','Rehogá la cebolla, sumá la acelga y dejá que se seque. Fuera del fuego, mezclá con ricota, queso, 2 huevos y condimentos.','Forrá un molde con una tapa, volcá el relleno, hacé 4 huecos y rompé un huevo en cada uno.','Cubrí con la otra tapa, repulgá, pinchá y horneá a 200 °C unos 40 minutos.']},
{id:'faina',n:'Fainá',c:'UY',s:6,t:35,d:'Harina de garbanzos al horno, finita y crocante.',i:[
[250,'g','harina de garbanzos','harina de garbanzos'],[500,'ml','agua','agua'],[60,'ml','aceite de oliva','aceite'],[1,'cdita','sal','sal'],[null,'','pimienta negra','pimienta']],
p:['Batí la harina con el agua y la sal hasta que no queden grumos. Dejá reposar al menos 1 hora y retirá la espuma.','Calentá el horno al máximo con la pizzera y la mitad del aceite adentro.','Sumá el resto del aceite a la mezcla y volcá en la pizzera caliente en capa fina.','Horneá 15 a 20 minutos hasta que la superficie dore. Pimienta al salir.']},
{id:'caruso',n:'Capeletis a la Caruso',c:'UY',s:4,t:30,d:'Crema, jamón y champiñones. Clásico montevideano.',i:[
[500,'g','capeletis','pasta rellena'],[300,'ml','crema de leche','crema'],[150,'g','jamón cocido en tiras','jamón'],[200,'g','champiñones','hongos'],[30,'g','manteca','manteca'],[50,'g','queso rallado','parmesano'],[null,'','nuez moscada','nuez moscada']],
p:['Saltá los champiñones en la manteca hasta dorar y sumá el jamón.','Agregá la crema y dejá reducir unos minutos a fuego suave. Condimentá con nuez moscada.','Herví los capeletis y escurrí.','Mezclá con la salsa y el queso rallado.']},

{id:'tortilla',n:'Tortilla de patatas',c:'ES',s:4,t:45,d:'Con o sin cebolla, según la casa.',i:[
[800,'g','papas','papa'],[6,'u','huevos','huevo'],[1,'u','cebolla (opcional)','cebolla'],[400,'ml','aceite de oliva para confitar','aceite para freír'],[1,'cdita','sal','sal']],
p:['Cortá las papas en láminas finas y la cebolla en juliana.','Confitalas en el aceite a fuego medio-bajo unos 20 minutos, hasta que estén tiernas sin dorar. Escurrí.','Batí los huevos con sal, mezclá con las papas tibias y dejá reposar 5 minutos.','Cuajá en sartén con una cucharada de aceite, dala vuelta con un plato y terminá del otro lado.']},
{id:'paella',n:'Paella valenciana',c:'ES',s:4,t:60,d:'La original lleva pollo, conejo y garrofón.',i:[
[600,'g','pollo trozado','pollo'],[400,'g','conejo trozado (o más pollo)','conejo'],[320,'g','arroz redondo','arroz'],[200,'g','chauchas planas','chauchas'],[150,'g','garrofón (poroto manteca) cocido','porotos cocidos'],[1,'u','tomate rallado','tomate'],[100,'ml','aceite de oliva','aceite'],[1,'cdita','pimentón dulce','pimentón'],[1200,'ml','agua','agua'],[null,'','hebras de azafrán','azafrán'],[null,'','romero','romero'],[null,'','sal','sal']],
p:['Dorá bien el pollo y el conejo en el aceite, a fuego medio, en la paellera.','Sumá las chauchas y el garrofón, después el tomate y el pimentón; sofreí un minuto sin quemar.','Agregá el agua, el azafrán y sal, y herví 20 minutos para armar el caldo.','Repartí el arroz parejo y no lo revuelvas más. Cociná 18 minutos y dejá reposar 5 con el romero encima.']},
{id:'gazpacho',n:'Gazpacho',c:'ES',s:4,t:20,d:'Sopa fría andaluza. Necesita 2 horas de heladera.',i:[
[1000,'g','tomates bien maduros','tomate'],[1,'u','pepino','pepino'],[1,'u','morrón verde','morrón'],[1,'diente','ajo','ajo'],[50,'g','pan del día anterior','pan'],[80,'ml','aceite de oliva','aceite'],[2,'cda','vinagre de jerez','vinagre'],[200,'ml','agua fría','agua'],[null,'','sal','sal']],
p:['Trozá tomate, pepino, morrón y ajo. Remojá el pan en un poco de agua.','Procesá todo con el vinagre y la sal hasta que quede liso.','Con la licuadora andando, sumá el aceite en hilo para emulsionar. Ajustá con agua.','Enfriá al menos 2 horas y serví bien frío.']},
{id:'gambas',n:'Gambas al ajillo',c:'ES',s:4,t:15,d:'Tapa rápida, con pan para mojar.',i:[
[400,'g','langostinos pelados','langostinos'],[6,'diente','ajo laminado','ajo'],[1,'u','guindilla','guindilla'],[120,'ml','aceite de oliva','aceite'],[null,'','perejil','perejil'],[null,'','sal','sal']],
p:['Calentá el aceite a fuego suave con el ajo y la guindilla, en cazuela de barro o sartén.','Cuando el ajo empiece a tomar color, subí el fuego y sumá los langostinos con sal.','Cociná 2 minutos, hasta que cambien de color.','Perejil por encima y a la mesa chisporroteando.']},
{id:'lentejas',n:'Lentejas con chorizo',c:'ES',s:6,t:60,d:'Plato de cuchara de invierno.',i:[
[400,'g','lentejas','lentejas'],[200,'g','chorizo','chorizo'],[300,'g','papas','papa'],[2,'u','zanahorias','zanahoria'],[1,'u','cebolla','cebolla'],[1,'u','morrón','morrón'],[2,'diente','ajo','ajo'],[1,'cdita','pimentón','pimentón'],[2,'u','hojas de laurel','laurel'],[3,'cda','aceite de oliva','aceite'],[1500,'ml','agua','agua'],[null,'','sal','sal']],
p:['Sofreí cebolla, morrón, zanahoria y ajo en el aceite.','Sumá el chorizo en rodajas y el pimentón; revolvé un minuto.','Agregá lentejas, laurel y el agua fría. Cociná 30 minutos a fuego suave.','Sumá las papas cortadas quebrándolas con el cuchillo y cociná 15 minutos más, hasta que el caldo espese.']},
{id:'croquetas',n:'Croquetas de jamón',c:'ES',s:6,t:120,m:3,d:'Unas 30. La bechamel necesita 4 horas de frío.',i:[
[100,'g','manteca','manteca'],[100,'g','harina','harina de trigo'],[1000,'ml','leche','leche'],[150,'g','jamón serrano picado','jamón serrano'],[0.5,'u','cebolla','cebolla'],[2,'u','huevos','huevo'],[200,'g','pan rallado','pan rallado'],[null,'','nuez moscada','nuez moscada'],[null,'','aceite para freír','aceite para freír']],
p:['Rehogá la cebolla muy picada en la manteca, sumá el jamón y luego la harina; cociná 2 minutos.','Agregá la leche caliente de a poco, sin dejar de batir, hasta una bechamel espesa (unos 15 minutos).','Extendé en una fuente, tapá a piel con film y enfriá mínimo 4 horas.','Formá las croquetas, pasalas por huevo y pan rallado y freí en aceite bien caliente.']},

{id:'carbonara',n:'Spaghetti alla carbonara',c:'IT',s:4,t:20,d:'Sin crema: la salsa es huevo, queso y el calor de la pasta.',i:[
[400,'g','spaghetti','pasta'],[150,'g','guanciale (o panceta)','guanciale'],[4,'u','yemas','yema'],[1,'u','huevo entero','huevo'],[60,'g','pecorino romano rallado','pecorino'],[null,'','pimienta negra recién molida','pimienta']],
p:['Cortá el guanciale en tiras y dorálo en sartén sin aceite hasta que suelte la grasa.','Batí yemas, huevo, pecorino y bastante pimienta.','Herví la pasta al dente y pasala a la sartén fuera del fuego, con un poco de agua de cocción.','Sumá la crema de huevo revolviendo rápido: el calor la espesa sin que se haga revuelto.']},
{id:'lasagna',n:'Lasagna alla bolognese',c:'IT',s:8,t:180,d:'Ragù lento, bechamel y parmesano.',i:[
[400,'g','carne picada vacuna','carne picada'],[200,'g','carne picada de cerdo','cerdo'],[100,'g','panceta','panceta'],[1,'u','cebolla','cebolla'],[1,'u','zanahoria','zanahoria'],[1,'u','rama de apio','apio'],[400,'g','puré de tomate','tomate triturado'],[150,'ml','vino tinto','vino'],[150,'ml','leche (ragù)','leche'],[1000,'ml','leche (bechamel)','leche'],[80,'g','manteca','manteca'],[80,'g','harina','harina de trigo'],[500,'g','láminas de lasaña','pasta'],[150,'g','parmesano rallado','parmesano'],[null,'','nuez moscada','nuez moscada'],[null,'','sal','sal']],
p:['Para el ragù: rehogá cebolla, zanahoria y apio picados con la panceta; sumá las carnes y dorá.','Agregá el vino y dejá evaporar, después el tomate y la leche. Cociná a fuego mínimo 2 horas.','Para la bechamel, cociná manteca y harina, sumá la leche y batí hasta espesar. Nuez moscada y sal.','Armá capas: bechamel, láminas, ragù, bechamel y parmesano. Repetí y horneá a 180 °C unos 40 minutos.']},
{id:'risotto',n:'Risotto ai funghi',c:'IT',s:4,t:40,d:'Cremoso sin crema, gracias al almidón del arroz.',i:[
[320,'g','arroz carnaroli','arroz'],[300,'g','champiñones u hongos frescos','hongos'],[20,'g','hongos secos (porcini)','hongos secos'],[1200,'ml','caldo caliente','caldo'],[1,'u','cebolla chica','cebolla'],[100,'ml','vino blanco','vino'],[60,'g','manteca','manteca'],[60,'g','parmesano','parmesano'],[null,'','sal','sal']],
p:['Hidratá los hongos secos en agua tibia, picalos y sumá esa agua al caldo.','Rehogá la cebolla en la mitad de la manteca, agregá los hongos y luego el arroz; nacaralo 2 minutos.','Mojá con el vino y después sumá caldo de a cucharón, revolviendo, durante unos 17 minutos.','Fuera del fuego, mantecá con el resto de la manteca y el parmesano. Reposá 2 minutos tapado.']},
{id:'cacciatora',n:'Pollo alla cacciatora',c:'IT',s:4,t:60,d:'Pollo "a la cazadora" con tomate, vino y aceitunas.',i:[
[1200,'g','pollo trozado','pollo'],[400,'g','tomate triturado','tomate triturado'],[1,'u','cebolla','cebolla'],[2,'diente','ajo','ajo'],[80,'g','aceitunas negras','aceitunas'],[150,'ml','vino tinto','vino'],[3,'cda','aceite de oliva','aceite'],[null,'','romero','romero'],[null,'','sal y pimienta','sal']],
p:['Dorá el pollo salpimentado en el aceite y reservá.','En la misma olla rehogá cebolla y ajo. Volvé el pollo y mojá con el vino.','Sumá el tomate, las aceitunas y el romero.','Tapá y cociná a fuego suave 35 a 40 minutos, hasta que la carne se separe del hueso.']},
{id:'parmigiana',n:'Parmigiana di melanzane',c:'IT',s:6,t:90,d:'Capas de berenjena, tomate y queso al horno.',i:[
[1200,'g','berenjenas','berenjena'],[700,'ml','salsa de tomate','tomate triturado'],[300,'g','mozzarella','mozzarella'],[100,'g','parmesano','parmesano'],[null,'','albahaca fresca','albahaca'],[null,'','aceite para freír','aceite para freír'],[null,'','sal','sal']],
p:['Cortá las berenjenas en rodajas de medio centímetro, salalas y dejá que suelten agua 30 minutos. Secalas.','Freílas o grillalas hasta dorar.','En una fuente, alterná salsa, berenjenas, mozzarella, parmesano y albahaca.','Terminá con salsa y parmesano. Horneá a 190 °C unos 35 minutos y dejá reposar antes de cortar.']},
{id:'tiramisu',n:'Tiramisù',c:'IT',s:8,sw:1,t:30,d:'Necesita 6 horas de heladera.',i:[
[500,'g','mascarpone','mascarpone'],[4,'u','huevos','huevo'],[100,'g','azúcar','azúcar'],[300,'g','vainillas (savoiardi)','vainillas'],[300,'ml','café fuerte frío','café'],[20,'g','cacao amargo','cacao']],
p:['Batí las yemas con el azúcar hasta blanquear y sumá el mascarpone.','Batí las claras a nieve y unilas con movimientos envolventes.','Mojá rápido las vainillas en café y armá capas alternando con la crema.','Enfriá al menos 6 horas y espolvoreá cacao antes de servir.']},

{id:'mac',n:'Mac and cheese',c:'US',s:6,t:45,d:'Gratinado al horno, con costra de pan rallado.',i:[
[450,'g','macarrones','pasta'],[300,'g','cheddar rallado','cheddar'],[750,'ml','leche','leche'],[60,'g','manteca','manteca'],[40,'g','harina','harina de trigo'],[1,'cdita','mostaza','mostaza'],[50,'g','pan rallado','pan rallado'],[null,'','sal y pimienta','sal']],
p:['Herví los macarrones 2 minutos menos de lo que indica el paquete.','Hacé una bechamel con manteca, harina y leche; fuera del fuego sumá la mostaza y casi todo el cheddar.','Mezclá con la pasta y volcá en una fuente.','Cubrí con el resto del queso y el pan rallado y gratiná a 200 °C unos 20 minutos.']},
{id:'fried-chicken',n:'Pollo frito con buttermilk',c:'US',s:4,t:60,d:'Marinado mínimo 4 horas. Crocante por fuera, jugoso por dentro.',i:[
[1500,'g','pollo trozado','pollo'],[500,'ml','buttermilk (o leche con 2 cdas de limón)','buttermilk'],[300,'g','harina','harina de trigo'],[2,'cdita','pimentón','pimentón'],[1,'cdita','ajo en polvo','ajo'],[null,'','sal y pimienta','sal'],[null,'','aceite para freír','aceite para freír']],
p:['Mariná el pollo en el buttermilk con sal, mínimo 4 horas (mejor toda la noche).','Mezclá la harina con pimentón, ajo, sal y pimienta.','Escurrí cada presa y pasala por la harina presionando para que quede rugosa.','Freí a 165 °C entre 12 y 15 minutos, hasta que adentro llegue a 74 °C. Escurrí sobre rejilla.']},
{id:'cheeseburger',n:'Cheeseburger smash',c:'US',s:4,t:25,d:'Hamburguesa aplastada en plancha muy caliente.',i:[
[600,'g','carne picada (20% grasa)','carne picada'],[4,'u','panes de hamburguesa','pan'],[4,'u','fetas de cheddar','cheddar'],[1,'u','cebolla','cebolla'],[4,'u','pepinillos','pepinillos'],[80,'g','lechuga','lechuga'],[1,'u','tomate','tomate'],[null,'','sal y pimienta','sal']],
p:['Dividí la carne en 4 bolas sin amasarla demasiado.','En plancha muy caliente, aplastalas bien finas y salpimentá.','Cociná 2 a 3 minutos, dalas vuelta y poné el cheddar encima.','Tostá los panes y armá con lechuga, tomate, cebolla y pepinillos.']},
{id:'chili',n:'Chili con carne',c:'US',s:6,t:75,d:'Guiso texano de carne, tomate y porotos.',i:[
[500,'g','carne picada','carne picada'],[400,'g','porotos rojos cocidos','porotos cocidos'],[400,'g','tomate triturado','tomate triturado'],[1,'u','cebolla','cebolla'],[2,'diente','ajo','ajo'],[1,'u','morrón','morrón'],[2,'cda','chili en polvo','chili en polvo'],[1,'cdita','comino','comino'],[250,'ml','caldo','caldo'],[2,'cda','aceite','aceite'],[null,'','sal','sal']],
p:['Dorá la carne en el aceite a fuego fuerte.','Sumá cebolla, ajo y morrón y cociná hasta ablandar.','Agregá chili y comino, tostá un minuto, y después el tomate y el caldo.','Cociná tapado 40 minutos a fuego bajo. Sumá los porotos en los últimos 15.']},
{id:'pancakes',n:'Pancakes',c:'US',s:4,sw:1,t:25,d:'Unos 10, esponjosos.',i:[
[200,'g','harina','harina de trigo'],[300,'ml','leche','leche'],[1,'u','huevo','huevo'],[30,'g','manteca derretida','manteca'],[25,'g','azúcar','azúcar'],[2,'cdita','polvo de hornear','polvo de hornear'],[1,'pizca','sal','sal']],
p:['Mezclá los secos en un bol y los líquidos en otro.','Uní sin batir de más: unos grumos están bien.','Cociná cucharones en sartén apenas enmantecada a fuego medio.','Dales vuelta cuando aparezcan burbujas en la superficie.']},
{id:'brownies',n:'Brownies',c:'US',s:12,sw:1,t:45,d:'Centro húmedo, molde de 20×20 cm.',i:[
[200,'g','chocolate semiamargo','chocolate'],[170,'g','manteca','manteca'],[250,'g','azúcar','azúcar'],[3,'u','huevos','huevo'],[90,'g','harina','harina de trigo'],[30,'g','cacao amargo','cacao'],[100,'g','nueces','nueces'],[1,'pizca','sal','sal']],
p:['Derretí chocolate y manteca a baño María.','Batí los huevos con el azúcar y unilos al chocolate tibio.','Incorporá harina, cacao, sal y nueces.','Horneá a 175 °C unos 25 minutos: el centro tiene que quedar húmedo.']},

{id:'feijoada',n:'Feijoada',c:'BR',s:8,t:180,d:'Porotos negros con carnes. La carne seca se desala la noche anterior.',i:[
[500,'g','porotos negros (remojados)','porotos'],[300,'g','carne seca desalada','carne seca'],[300,'g','costilla de cerdo ahumada','cerdo'],[300,'g','linguiça','chorizo'],[200,'g','paio','chorizo'],[150,'g','panceta','panceta'],[2,'u','cebollas','cebolla'],[4,'diente','ajo','ajo'],[3,'u','hojas de laurel','laurel'],[2,'cda','aceite','aceite'],[null,'','sal','sal']],

{id:'chipa-mestizo',n:'Chipa mestizo',c:'PY',s:12,t:70,src:'Oster Paraguay · '+SRC.rp,d:'Almidón y harina de maíz juntos. Unas 40 roscas.',i:[

{id:'lampreado',n:'Lampreado',c:'PY',s:4,t:60,src:SRC.lcp+' · '+SRC.abc,d:'Tortitas de carne hervida, rebozadas y fritas. Sin mandioca, a diferencia del payagua.',i:[

{id:'chicharo-trenzado',n:'Chicharõ trenzado',c:'PY',s:6,t:100,src:SRC.abc,d:'Tiras de matambre trenzadas, hervidas con limón y doradas. Infaltable en San Juan.',i:[

{id:'chicharo-huiti',n:"Chicharõ hu'itĩ",c:'PY',s:5,t:60,src:SRC.velilla+' · '+SRC.cr,d:'Costillitas de cerdo doradas en su grasa, envueltas en harina de maíz tostada.',i:[

{id:'ryguasu-kae',n:"Ryguasu ka'ẽ",c:'PY',s:6,t:150,src:SRC.cr,d:'Gallina hervida en caldo aromático y terminada al horno.',i:[

{id:'bori-carne',n:'Borí borí de carne',c:'PY',s:6,t:120,src:SRC.pc,d:'Caldo de osobuco con bolitas de maíz y queso.',i:[

{id:'caldo-pata',n:'Caldo de pata',c:'PY',s:6,t:100,src:SRC.rp,d:'Caldo espeso de pata vacuna con arroz, tomate y queso.',i:[

{id:'kumanda-pata',n:'Kumandá con pata',c:'PY',s:4,t:150,src:SRC.rp,d:'Guiso caldoso de poroto rojo, pata, zapallo y queso. Porotos en remojo desde la noche anterior.',i:[

{id:'mbaipy-soo',n:"Mbaipy so'o",c:'PY',s:4,t:60,src:'El Nacional Py',d:'Carne guisada espesada con harina de maíz, como una polenta cremosa con queso.',i:[

{id:'arro-yukysy',n:'Arro yukysy',c:'PY',s:4,t:35,src:SRC.velilla,d:'Caldo liviano de arroz con leche y queso, con un huevo por plato.',i:[

{id:'andai-yukysy',n:'Andai aky yukysy',c:'PY',s:4,t:35,src:SRC.velilla,d:'Caldo de zapallito tierno con arroz, ligado con huevo y queso.',i:[

{id:'kosereva',n:'Koserevá',c:'PY',s:7,sw:1,t:180,src:SRC.abc+' · '+SRC.rp,d:'Cascos de naranja agria en miel negra con clavo. Se desamargan de 1 a 4 días antes.',i:[

{id:'andai-kamby',n:'Andai kamby',c:'PY',s:6,sw:1,t:75,src:SRC.cr,d:'Zapallo en almíbar pisado con leche y canela. Se sirve frío.',i:[

{id:'dulce-zapallo',n:'Dulce de zapallo',c:'PY',s:20,sw:1,t:150,src:SRC.velilla,d:'Cubos de zapallo translúcidos en almíbar. Llevan una noche de remojo.',i:[

{id:'dulce-guayaba',n:'Dulce de guayaba en casco',c:'PY',s:8,sw:1,t:70,src:SRC.rp,d:'Mitades de guayaba en almíbar, para comer con queso Paraguay.',i:[

{id:'torta-miel-negra',n:'Torta de miel negra',c:'PY',s:8,sw:1,t:65,src:'paraguayrecetas.com',d:'Torta húmeda de miel de caña y naranja, típica de Itá.',i:[

{id:'huiti-manduvi',n:"Hu'itĩ manduvi",c:'PY',s:10,sw:1,t:30,src:SRC.velilla,d:'Gofio dulce de maíz tostado con maní.',i:[

{id:'carbonada',n:'Carbonada criolla',c:'AR',s:6,t:90,src:'MDZ Online',d:'Guiso patrio de carne con papa, batata, zapallo y choclo, con un toque dulce.',i:[

{id:'gramajo',n:'Revuelto Gramajo',c:'AR',s:4,t:30,d:'Papas paja con jamón, huevo y arvejas.',i:[

{id:'tortitas-negras',n:'Tortitas negras',c:'AR',s:8,sw:1,t:150,d:'Facturas de masa leudada con azúcar negra. Unas 16.',i:[

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>keyOf(new Date());
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dayTitle=k=>k===todayKey()?'Hoy':k===addDays(todayKey(),-1)?'Ayer':k===addDays(todayKey(),1)?'Mañana':capi(DOW[fromKey(k).getDay()]);
const dayLong=k=>{const d=fromKey(k);return capi(DOW[d.getDay()])+' '+d.getDate()+' de '+MON[d.getMonth()]};

  else if(/caldo|vori|bori|soyo|sopa|chowder|minestrone|gazpacho|salmorejo|locro|jopara|kumanda|yukysy|kiveve|feijoada|fabada|cocido|lentejas|chili|buseca|carbonada|mbaipy|atolada|pira/.test(n)) k='sopa';

}

function grams(q,u,k){
  if(q==null) return 0;
  if(u==='g'||u==='ml') return q;
  if(u==='cda') return q*15;
  if(u==='cdita'||u==='diente') return q*5;
  if(u==='pizca'||u==='') return 0;
  return q*((N[k]&&N[k][4])||100);
}
function nutriOf(list,f=1){
  const t={kcal:0,p:0,c:0,g:0};

  return t;
}

async function initCloud(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    CLOUD.col=db.collection('data/users/'+uid);
    const first=await CLOUD.col.get();
    CLOUD.on=true;
    const has=id=>first.docs.some(d=>d.id===id&&d.exists);
    if(!has('ajustes')){
      putDoc('ajustes',{type:'settings',...SET});
      Object.keys(DAYS).forEach(k=>saveDay(k));
      MINE.forEach(r=>{ if(!has(r.id)) putDoc(r.id,toDoc(r)) });
    }
    CLOUD.col.onSnapshot(snap=>{
      const mine=[],days={}; let set=null;
      snap.docs.forEach(d=>{ if(!d.exists) return; const v=JSON.parse(JSON.stringify(d.data()));
        if(v.type==='recipe') mine.push(fromDoc(d.id,v));
        else if(v.type==='day'&&v.day) days[v.day]=v.entries||[];
        else if(v.type==='settings') set=v; });
      MINE=mine.sort((a,b)=>a.n.localeCompare(b.n,'es')); DAYS=days;
      if(set){ const {type,...rest}=set; SET={...SET_DEF,...rest} }
      refresh();
    },()=>{ CLOUD.on=false; toast('Sin conexión con tu cuenta: guardo en este celular.') });
  }catch(e){ console.warn(e) }
}

const ACT=[['sedentario','Sedentario',1.2,'Poco movimiento, trabajo sentado'],['ligero','Liviano',1.375,'Entrenás 1 a 3 días por semana'],['moderado','Moderado',1.55,'Entrenás 3 a 5 días por semana'],['alto','Alto',1.725,'Entrenás 6 o 7 días por semana'],['muyalto','Muy alto',1.9,'Doble turno o trabajo físico pesado']];
function calcGoal(p){
  if(!p||!(+p.peso)||!(+p.altura)||!(+p.edad)||!p.sexo) return null;
  const bmr=10*p.peso+6.25*p.altura-5*p.edad+(p.sexo==='h'?5:-161);
  const a=ACT.find(x=>x[0]===p.act)||ACT[1];
  const tdee=bmr*a[2];
  let k=tdee*(p.obj==='bajar'?0.85:p.obj==='subir'?1.1:1);
  const floor=p.sexo==='h'?1500:1200, floored=k<floor;
  k=Math.round(Math.max(k,floor)/10)*10;
  const prot=Math.round(p.peso*(p.obj==='mantener'?1.6:1.8));
  const fat=Math.round(k*0.27/9);
  return {kcal:k,p:prot,c:Math.max(0,Math.round((k-prot*4-fat*9)/4)),g:fat,bmr:Math.round(bmr),tdee:Math.round(tdee),floored,act:a};
}
function goal(){
  const p=SET.perfil, c=calcGoal(p);
  if(p&&p.manual&&+p.manualKcal>=800){ const k=Math.round(+p.manualKcal); const prot=+p.manualProt>0?Math.round(+p.manualProt):c?c.p:Math.round(k*.25/4), fat=Math.round(k*.27/9); return {kcal:k,p:prot,g:fat,c:Math.max(0,Math.round((k-prot*4-fat*9)/4)),manual:true,base:c} }
  return c||{kcal:2000,p:110,c:250,g:60,provisional:true};
}

const TILE={pollo:['pollo','Pollo'],carne:['carne','Carne'],cerdo:['cerdo','Cerdo'],mar:['mar','Pescado'],queso:['queso','Queso'],huevo:['huevo','Huevo'],pasta:['pasta','Pastas y arroz'],papa:['papa','Papa'],maiz:['maiz','Maíz y mandioca'],leg:['leg','Legumbres'],veg:['veg','Sin carne'],fav:['fav','Guardadas'],choco:['choco','Chocolate'],ddl:['ddl','Dulce de leche'],fruta:['fruta','Frutas'],lacteo:['lacteo','Leche y queso'],maizd:['maiz','Maíz y arroz'],mani:['mani','Frutos secos'],nohorno:['horno','Sin horno']};

/* ================= render general ================= */
let FOCUS=null;
function keepFocus(fn){
  const a=document.activeElement; const id=a&&a.id; let s=null,e=null; const typing=a&&a.tagName==='INPUT'&&a.type!=='checkbox'; const val=typing?a.value:null;
  try{ if(id&&a.setSelectionRange){ s=a.selectionStart; e=a.selectionEnd } }catch(_){}
  fn();
  if(id){ const n=$(id); if(n&&n!==document.activeElement){ if(typing&&n.tagName==='INPUT') n.value=val; n.focus({preventScroll:true}); try{ if(s!=null) n.setSelectionRange(s,e) }catch(_){} } }
}
function refresh(){ keepFocus(()=>{ renderTab(); if(D.r){ const r=ALL().find(x=>x.id===D.r.id); if(r){ D.r=r; renderPage() } } if(SH.type&&SH.type!=='editor') renderSheet() }) }
function renderTab(){
  document.querySelectorAll('.tab').forEach(t=>t.toggleAttribute('aria-current',false));
  const cur=document.querySelector(`.tab[data-v="${S.tab}"]`); if(cur) cur.setAttribute('aria-current','page');
  const b=$('mineBadge'); b.classList.toggle('hide',!MINE.length); b.textContent=MINE.length;
  $('screen').innerHTML=({hoy:viewHoy,recetas:viewRecetas,mias:viewMias,perfil:viewPerfil}[S.tab])();
}
function go(tab){ if(S.tab!==tab){ S.tab=tab; renderTab(); window.scrollTo(0,0) } else { window.scrollTo({top:0,behavior:'smooth'}) } }
let toastT;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600) }

/* ---------- Hoy ---------- */
function ring(pct,over,size,stroke,r){ const C=2*Math.PI*r; const v=Math.max(0,Math.min(1,pct))*C; return `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E7ECE5" stroke-width="${stroke}"/>`+(v>0.5?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${over?'#E8826E':'#E9B23A'}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${v.toFixed(1)} ${C.toFixed(1)}"/>`:'') }
function viewHoy(){
  const k=S.day, G=goal(), T=totals(k), rem=Math.round(G.kcal-T.kcal), over=rem<0;
  const monday=(()=>{const d=fromKey(k);const off=(d.getDay()+6)%7;return addDays(k,-off)})();
  const days=[...Array(7)].map((_,i)=>addDays(monday,i));

  const mb=(lab,v,g,col,ink)=>`<div class="macro"><span>${lab}</span><b>${num(v)} <small>/ ${num(g)} g</small></b><div class="bar"><i style="width:${Math.min(100,v/g*100||0)}%;background:${col}"></i></div></div>`;
  return `<div class="wrap">
  <header class="lt">
    <div class="lt-row"><span class="eyebrow">${dayLong(k)}</span><button class="icon-btn" data-act="add-food" data-meal="${defaultMeal()}" aria-label="Agregar comida">${IC.plus}</button></div>
    <h1 class="big">${dayTitle(k)}</h1>
  </header>
  ${goal().provisional?`<button class="setup press" data-act="tab" data-v="perfil">${thumb('fruta',44)}<span style="flex:1;text-align:left"><b>Configurá tu meta diaria</b><span>Con tu peso, altura y objetivo calculamos cuántas calorías te tocan. Mientras, usamos 2.000 kcal.</span></span>${IC.chev}</button>`:''}
  <section class="card ringcard" aria-label="Resumen de calorías">
    <div class="ringrow">
      <div class="ring"><svg viewBox="0 0 148 148" role="img" aria-label="${num(T.kcal)} de ${num(G.kcal)} kcal">${ring(T.kcal/G.kcal,over,148,14,62)}</svg>
        <div class="ctr"><b style="${over?'color:#B5321F':''}">${num(Math.abs(rem))}</b><span>${over?'kcal de más':'kcal restantes'}</span></div></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:14px">
        <div class="kv"><span>Consumido</span><b>${num(T.kcal)} <small>kcal</small></b></div>
        <button class="kv press" data-act="open-meta" style="text-align:left;padding:0" aria-label="Cambiar meta diaria"><span>${G.provisional?'Meta provisoria':G.manual?'Tu meta':'Meta diaria'} <span style="color:var(--accent);font-weight:700">· Cambiar</span></span><b>${num(G.kcal)} <small>kcal</small></b></button>
      </div>
    </div>
    <div class="macros">${mb('Proteína',T.p,G.p,'#3E9A63')}${mb('Carbos',T.c,G.c,'#E9B23A')}${mb('Grasas',T.g,G.g,'#E8826E')}</div>
  </section>
  <nav class="week" aria-label="Semana">
    <button class="nav" data-act="week" data-d="-7" aria-label="Semana anterior">${IC.chevL}</button>
    ${days.map(d=>{const t=totals(d).kcal, g=goal().kcal; const dd=fromKey(d); return `<button class="day ${d===today?'today':''}" data-act="day" data-k="${d}" ${d===k?'aria-current="date"':''} aria-label="${dayLong(d)}"><span>${'DLMMJVS'[dd.getDay()]}</span><svg viewBox="0 0 30 30" aria-hidden="true">${ring(t/g,t>g,30,4,11).replace(/#E7ECE5/,d===k?'rgba(255,255,255,.35)':'#E7ECE5').replace(/#E9B23A/,d===k?'#FFFFFF':'#E9B23A')}</svg><b>${dd.getDate()}</b></button>`}).join('')}

      </div>
    </section>`}).join('')}

function recParts(){
  const pool=ALL().filter(r=>base(r)&&!isExcluded(r));

  if(SET.favs.length) cats.unshift({id:'fav'});

    return `<button class="tile" data-act="cat" data-v="${c.id}" aria-pressed="${S.cat===c.id}"><span class="ic" style="background:${ART_BG[k]}">${art(k)}</span><span class="lb">${l}</span><span class="ct">${n}</span></button>` }).join('');
  const list=pool.filter(r=>inCat(r,S.cat)).sort(SORTS[S.sort][1]);
  const showRail=!S.q&&S.cat==='all'&&!S.countries.size&&S.time==='any';
  const py=showRail?pool.filter(r=>r.c==='PY').sort((a,b)=>a.n.localeCompare(b.n,'es')).slice(0,14):[];

  return `<section style="display:flex;flex-direction:column;gap:14px"><h2 class="sec">${S.mode==='postre'?'¿De qué tenés ganas?':'¿Qué tenés en la heladera?'}</h2><div class="tiles">${tiles}</div></section>

    <div class="rail">${py.map(r=>{const k=recipeKind(r),ps=perServing(r);return `<button class="rcard press" data-act="open" data-id="${r.id}"><span class="art" style="background:${ART_BG[k]}">${art(k)}<span class="py">PY</span></span><span class="bd"><span class="nm">${esc(r.n)}</span><span class="meta">${r.t?`<span>${fmtTime(r.t)}</span>`:''}<span>${num(ps.kcal)} kcal</span><span class="pr">${num(ps.p)} g prot</span></span></span></button>`}).join('')}</div></section>`:''}
  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="listhead"><h2 class="sec">${S.cat==='all'?'Todas':(TILE[S.cat]||[0,''])[1]} <small>${list.length}</small></h2><button class="link" data-act="open-filters">${SORTS[S.sort][0]}</button></div>
    ${nOther?`<button class="pending press" style="background:var(--accent-soft);color:var(--accent)" data-act="mode" data-v="${other}"><b>También hay ${nOther} en ${other==='postre'?'Postres':'Salado'}</b>${IC.chevR}</button>`:''}
    ${list.length?`<div class="group">${list.map(rowRecipe).join('')}</div>`:`<div class="card empty">${art('sopa')}<span>Ninguna receta con estos filtros.<br>Probá otro ingrediente o sacá algún filtro.</span><button class="btn sec sm" data-act="clear-filters">Limpiar filtros</button></div>`}
  </section>`;
}
function rowRecipe(r){ const k=recipeKind(r), ps=perServing(r);

/* ================= ficha de receta ================= */
const D={r:null,f:1,tab:'ing',checks:new Set(),main:0};
function openRecipe(id){
  const r=ALL().find(x=>x.id===id); if(!r) return;
  const hk=(curCats().find(c=>c.id===S.cat)||{}).keys||[];
  const hi=r.i.findIndex(x=>x[0]!=null&&hk.includes(x[3]));
  Object.assign(D,{r,f:1,tab:'ing',checks:new Set(),main:hi>=0?hi:(r.m||Math.max(0,r.i.findIndex(x=>x[0]!=null)))});
  renderPage(); $('page').scrollTop=0;
  $('page').classList.add('open'); $('pagefoot').classList.remove('hide'); document.body.style.overflow='hidden';
  setTimeout(()=>{ const b=$('page').querySelector('.glass'); b&&b.focus({preventScroll:true}) },60);
}
function closePage(){ $('page').classList.remove('open'); $('pagefoot').classList.add('hide'); document.body.style.overflow=''; D.r=null; renderTab() }
function renderPage(){
  const r=D.r,f=D.f,k=recipeKind(r),ps=perServing(r),fav=favs().has(r.id);
  const serv=Math.round(r.s*f*10)/10, m=r.i[D.main], changed=Math.abs(f-1)>.001;
  const tabs=[['ing','Ingredientes'],['prep','Preparación'],['nut','Nutrición']];

let AL=null;
function openFood(meal){ AL={meal:meal||defaultMeal(),items:[],name:'',q:''}; openSheet('alimento') }
function alAdd(k){ const f=foodOf(k); if(!f) return; const u=f.u[0]; AL.items.push({k,g:u?u[1]:100,u:u?u[0]:'100 g'}); AL.q='' }
function alTotals(){ const t={kcal:0,p:0,c:0,g:0}; AL.items.forEach(it=>{const f=foodOf(it.k); if(!f) return; const n=foodNut(f,it.g); t.kcal+=n.kcal;t.p+=n.p;t.c+=n.c;t.g+=n.g}); return t }
function shAlimento(){
  const t=alTotals(), res=AL.q?searchFoods(AL.q):[];

/* ================= modo cocina ================= */
let CK=null, wake=null;
function parseTimer(s){ const t=norm(s); let m=t.match(/(\d+)\s*(?:y media\s*)?(hora|horas)/); if(m){ return (+m[1]*60+(/y media/.test(t)?30:0))*60 } m=t.match(/(\d+)\s*(?:a\s*\d+\s*)?(minuto|minutos|min\b)/); return m?+m[1]*60:0 }
async function openCook(){
  CK={r:D.r,i:0,left:0,total:0,run:false,iv:null}; ckSetTimer(); renderCook(); $('cook').classList.add('open');
  try{ wake=await navigator.wakeLock.request('screen') }catch(e){ wake=null }
}
function closeCook(){ if(CK&&CK.iv) clearInterval(CK.iv); CK=null; $('cook').classList.remove('open'); try{ wake&&wake.release() }catch(e){} wake=null }
function ckSetTimer(){ if(CK.iv) clearInterval(CK.iv); CK.iv=null; CK.run=false; CK.total=CK.left=parseTimer(CK.r.p[CK.i]) }
const mmss=s=>`${Math.floor(s/60)}:${pad(s%60)}`;
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3)}) }catch(e){} }
function ckToggle(){
  if(CK.run){ clearInterval(CK.iv); CK.iv=null; CK.run=false; renderCook(); return }
  if(CK.left<=0) CK.left=CK.total; CK.run=true;
  CK.iv=setInterval(()=>{ CK.left--; if(CK.left<=0){ clearInterval(CK.iv); CK.iv=null; CK.run=false; CK.left=0; beep(); toast(`¡Listo el paso ${CK.i+1}!`) } const c=$('ckClock'); if(c) c.textContent=mmss(Math.max(0,CK.left)); if(CK.left<=0) renderCook() },1000);
  renderCook();
}
function renderCook(){
  const r=CK.r, n=r.p.length, i=CK.i;
  $('cook').innerHTML=`<div class="lt-row"><button class="icon-btn" data-act="cook-close" aria-label="Salir del modo cocina">${IC.x}</button><span style="flex:1;display:flex;flex-direction:column;min-width:0"><span class="eyebrow">Modo cocina</span><b style="font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.n)}</b></span><span class="eyebrow">${i+1} de ${n}</span></div>
  <div class="prog" aria-hidden="true">${r.p.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div>
  <div><span class="stepn">PASO ${i+1}</span><p class="stept">${esc(r.p[i])}</p></div>
  ${CK.total?`<div class="card timer"><span class="grow"><span class="eyebrow">Temporizador</span><span class="clock" id="ckClock">${mmss(CK.left)}</span></span>${CK.left!==CK.total&&!CK.run?`<button class="icon-btn" data-act="cook-reset" aria-label="Reiniciar">${IC.x}</button>`:''}<button class="go press" data-act="cook-timer" aria-label="${CK.run?'Pausar':'Iniciar'} temporizador">${CK.run?IC.pause:IC.play('#17201A')}</button></div>`:''}
  <span class="note" style="margin:0">${wake?'La pantalla queda encendida mientras cocinás.':'Tip: tocá la pantalla de vez en cuando para que no se apague.'}</span>
  <div class="navbtns"><button class="btn sec" data-act="cook-prev" ${i===0?'disabled':''}>Anterior</button>${i<n-1?`<button class="btn pri" data-act="cook-next">Siguiente paso</button>`:`<button class="btn pri" data-act="cook-close">Terminé</button>`}</div>`;
}

/* ================= copia de seguridad ================= */
async function doBackup(){
  const data={app:'despensa-py',v:2,fecha:new Date().toISOString(),ajustes:SET,dias:DAYS,recetas:MINE.map(r=>({id:r.id,...toDoc(r)}))};
  const name='despensa-copia-'+todayKey()+'.json', txt=JSON.stringify(data);
  try{ const f=new File([txt],name,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Copia de Despensa Py'}); return } }catch(e){ if(e&&e.name==='AbortError') return }
  try{ const url=URL.createObjectURL(new Blob([txt],{type:'application/json'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Copia descargada') }
  catch(e){ toast('No se pudo crear la copia') }
}
async function doRestore(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||d.app!=='despensa-py') throw 0;
    const s=d.ajustes||{};
    SET={...SET_DEF,...SET,...s,favs:[...new Set([...(SET.favs||[]),...(s.favs||[])])],excl:[...new Set([...(SET.excl||[]),...(s.excl||[])])],perfil:SET.perfil||s.perfil||null};
    let nd=0; Object.entries(d.dias||{}).forEach(([k,es])=>{ const cur=DAYS[k]||[]; const ids=new Set(cur.map(e=>e.id)); const add=(es||[]).filter(e=>e&&!ids.has(e.id)); if(add.length){ DAYS[k]=cur.concat(add); nd+=add.length; saveDay(k) } });
    let nr=0; (d.recetas||[]).forEach(x=>{ if(!x||!x.id) return; const r=fromDoc(x.id,x); if(!MINE.some(m=>m.id===r.id)){ nr++ } saveRecipe(r) });
    saveSettings(true); if(!CLOUD.on) saveLocal();
    renderTab(); toast(`Listo: ${nr} ${nr===1?'receta':'recetas'} y ${nd} ${nd===1?'comida':'comidas'} recuperadas`);
  }catch(e){ toast('Ese archivo no es una copia de Despensa Py') }
}

  'al-save':()=>{ const n=$('alName'); if(n) AL.name=n.value; alCommit() },
  'ed-type':a=>{ edRead(); E.sw=+a.dataset.v; renderSheet() },
  'ed-main':a=>{ edRead(); const i=+a.dataset.i; if(E.i[i][0]==null){ E.err='El principal necesita una cantidad.'; } else { E.m=i; E.err='' } renderSheet() },
  'ed-rm':a=>{ edRead(); const i=+a.dataset.i; E.i.splice(i,1); if(E.m>=i) E.m=Math.max(0,E.m-1); edFixMain(); renderSheet() },
  'ed-save':()=>edSave(),
  'ed-del':()=>{ if(!E.armed){ E.armed=true; edRead(); renderSheet(); return } const id=E.id; closeSheet(); removeRecipe(id); if(D.r&&D.r.id===id) closePage(); renderTab(); toast('Receta borrada') },
  'cook-close':()=>closeCook(),
  'cook-next':()=>{ CK.i=Math.min(CK.r.p.length-1,CK.i+1); ckSetTimer(); renderCook() },
  'cook-prev':()=>{ CK.i=Math.max(0,CK.i-1); ckSetTimer(); renderCook() },
  'cook-timer':()=>ckToggle(),
  'cook-reset':()=>{ ckSetTimer(); renderCook() }
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a||a.disabled) return;
  if(a.tagName==='LABEL') return;
  const f=ACTS[a.dataset.act]; if(f){ e.preventDefault(); f(a,e) }
  if(a.dataset.act!=='del-entry') document.querySelectorAll('.del.armed').forEach(x=>{x.classList.remove('armed');x.innerHTML=IC.x});
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ S.q=t.value; $('recParts').innerHTML=recParts(); return }
  if(t.id==='alQ'){ AL.q=t.value; keepFocus(renderSheet); return }
  if(t.id==='scaleIn'){ const v=parseQ(t.value), m=D.r.i[D.main]; if(v&&v>0&&m[0]){ D.f=v/m[0]; keepFocus(renderPage) } return }
  if(t.dataset.rgq!=null){ const v=parseQ(t.value); if(v!=null){ RG.ings[+t.dataset.rgq][0]=v; const ae=t; keepFocus(renderSheet) } return }
  if(t.id==='mtK'){ MT.kcal=t.value.replace(/\D/g,''); keepFocus(renderSheet); return }
  if(t.id==='mtP'){ MT.prot=t.value.replace(/\D/g,''); keepFocus(renderSheet); return }
  if(t.id==='rgG'){ RG.grams=t.value; keepFocus(renderSheet); return }
  if(t.dataset.alg!=null){ const v=parseQ(t.value); if(v!=null&&v>0){ const it=AL.items[+t.dataset.alg]; it.g=v; it.u='otra'; keepFocus(renderSheet) } return }
  if(t.id==='alName'){ AL.name=t.value; return }
  if(t.dataset.edq!=null){ E.i[+t.dataset.edq][0]=parseQ(t.value); return }
  if(t.dataset.pf){ const p=SET.perfil=SET.perfil||{}; const f=t.dataset.pf; if(t.type==='checkbox'){ p[f]=t.checked; saveSettings(); keepFocus(renderTab); return } p[f]=f==='act'?t.value:(parseQ(t.value)??''); saveSettings(); const sc=window.scrollY; keepFocus(renderTab); window.scrollTo(0,sc); return }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ck!=null){ const i=+t.dataset.ck; t.checked?D.checks.add(i):D.checks.delete(i); t.closest('.ing').classList.toggle('done',t.checked); return }
  if(t.dataset.rgsave!=null){ RG.save=t.checked; RG.saveTouched=true; return }
  if(t.dataset.edu!=null){ edRead(); const x=E.i[+t.dataset.edu]; if(t.value===''){ x[0]=null; x[1]='' } else { x[1]=t.value; if(x[0]==null) x[0]=1 } edFixMain(); renderSheet(); return }
  if(t.id==='impFile'){ const f=t.files&&t.files[0]; if(f) doRestore(f); t.value=''; return }
  if(t.id==='pfAct'){ (SET.perfil=SET.perfil||{}).act=t.value; saveSettings(); keepFocus(renderTab) }
});
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form; if(!f) return; e.preventDefault();
  if(f==='excl'){ const v=norm($('exclIn').value); if(!v) return; const k=allKeys.find(x=>norm(x)===v)||v; if(!SET.excl.includes(k)) SET.excl.push(k); saveSettings(); renderTab(); return }
  if(f==='rg-add'){ const n=$('rgAddN').value.trim(), q=parseQ($('rgAddQ').value); if(!n||!q){ toast('Poné el ingrediente y los gramos'); return } RG.ings.push([q,'g',n,matchKey(n)]); renderSheet(); return }
  if(f==='ed-add'){ edRead(); const n=$('edAddN').value.trim(), q=parseQ($('edAddQ').value); if(!n){ E.err='Escribí el ingrediente.'; renderSheet(); return } E.i.push([q==null?100:q,'g',n,matchKey(n)]); E.err=''; edFixMain(); renderSheet(); setTimeout(()=>{const x=$('edAddN');x&&x.focus()},30) }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(CK) closeCook(); else if(SH.type) ACTS['close-sheet'](); else if(D.r) closePage();
});

/* arrastrar la hoja hacia abajo para cerrarla */
(function(){
  let y0=0,t0=0,dy=0,last=[],active=false; const sh=$('sheet');
  sh.addEventListener('pointerdown',e=>{ if(!e.target.closest('[data-drag]')||e.target.closest('button')) return; active=true; y0=e.clientY; t0=performance.now(); dy=0; last=[[y0,t0]]; sh.classList.add('drag'); sh.setPointerCapture(e.pointerId) });
  sh.addEventListener('pointermove',e=>{ if(!active) return; dy=e.clientY-y0; const d=dy<0?-Math.pow(-dy,0.6):dy; sh.style.transform=`translateY(${d}px)`; last.push([e.clientY,performance.now()]); if(last.length>5) last.shift() });
  const end=()=>{ if(!active) return; active=false; sh.classList.remove('drag'); const [a,b]=[last[0],last[last.length-1]]; const v=(b[0]-a[0])/Math.max(1,b[1]-a[1]); sh.style.transform=''; if(dy>120||v>0.6) ACTS['close-sheet'](); };
  sh.addEventListener('pointerup',end); sh.addEventListener('pointercancel',end);
})();

/* ================= inicio ================= */
loadLocal();
renderTab();
initCloud();
setInterval(()=>{ const t=todayKey(); if(S._today&&S._today!==t&&S.day===S._today){ S.day=t; renderTab() } S._today=t },60000);
